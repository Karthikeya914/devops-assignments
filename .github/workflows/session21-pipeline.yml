name: Session 21 - OpsPulse Pipeline

on:
  push:
    paths:
      - 'session21/**'
      - '.github/workflows/session21-pipeline.yml'
    branches: [main]
  pull_request:
    paths:
      - 'session21/**'
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Automated Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: session21/backend

      - name: Run Pytest test suite
        run: pytest -v
        working-directory: session21/backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React frontend
        run: |
          npm install
          npm run build
        working-directory: session21/frontend

  build-scan-push:
    name: Docker Build, Trivy Security Scan & GHCR Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Resolve lowercase repository owner
        run: |
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ env.IMAGE_OWNER }}/opspulse-backend:${{ github.sha }} ./session21/backend
          docker build -t ghcr.io/${{ env.IMAGE_OWNER }}/opspulse-frontend:${{ github.sha }} ./session21/frontend

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/opspulse-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/opspulse-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push Images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/opspulse-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/opspulse-frontend:${{ github.sha }}
