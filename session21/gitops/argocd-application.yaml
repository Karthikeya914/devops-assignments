apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opspulse-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Karthikeya914/devops-assignments.git'
    targetRevision: main
    path: session21/helm/taskboard
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: opspulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
