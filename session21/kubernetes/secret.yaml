apiVersion: v1
kind: Secret
metadata:
  name: opspulse-secret
  namespace: opspulse
type: Opaque
stringData:
  POSTGRES_DB: "opspulse"
  POSTGRES_USER: "opspulse"
  POSTGRES_PASSWORD: "opspulse_secure_pass"
  DATABASE_URL: "postgresql+psycopg://opspulse:opspulse_secure_pass@opspulse-postgres:5432/opspulse"
