apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opspulse-ingress
  namespace: opspulse
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: opspulse.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: opspulse-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opspulse-frontend
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opspulse-backend-hpa
  namespace: opspulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opspulse-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
