apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opspulse-postgres-pvc
  namespace: opspulse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspulse-postgres
  namespace: opspulse
  labels:
    app: opspulse-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspulse-postgres
  template:
    metadata:
      labels:
        app: opspulse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: opspulse-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U opspulse -d opspulse"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U opspulse -d opspulse"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: opspulse-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: opspulse-postgres
  namespace: opspulse
  labels:
    app: opspulse-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: opspulse-postgres
