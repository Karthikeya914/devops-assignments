apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspulse-backend
  namespace: opspulse
  labels:
    app: opspulse-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opspulse-backend
  template:
    metadata:
      labels:
        app: opspulse-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: ghcr.io/karthikeya914/opspulse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: opspulse-config
            - secretRef:
                name: opspulse-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: opspulse-backend
  namespace: opspulse
  labels:
    app: opspulse-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: opspulse-backend
